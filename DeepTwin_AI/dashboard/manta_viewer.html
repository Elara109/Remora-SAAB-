<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MANTA Mini 3D digital twin</title>
<style>
:root{--bg:#04141f;--panel:rgba(5,22,33,.86);--line:#1d4a5e;--text:#e6f4f8;--mute:#8db3c2;--cyan:#2ec4d6;--orange:#ff9f1c;--ok:#5be3a0;--warn:#ffd166;--bad:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#04141f;--text:#e6f4f8}}
:root[data-theme="dark"]{--bg:#04141f;--text:#e6f4f8}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.top,.bot{position:fixed;left:10px;right:10px;z-index:2}
.top{top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.bot{bottom:calc(env(safe-area-inset-bottom,0px) + 10px);max-width:560px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;backdrop-filter:blur(6px)}
.stage{flex:1;min-width:150px}
.stage b{display:block;font-size:17px;letter-spacing:.2px}
.stage span{color:var(--mute);font-size:12px}
.steps{display:flex;gap:3px;margin-top:6px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--cyan)}.steps i.cur{background:var(--orange)}
.stat{min-width:78px}.stat b{display:block;font-size:17px}.stat span{color:var(--mute);font-size:12px}
.row{display:grid;grid-template-columns:96px 1fr 38px;align-items:center;gap:8px;margin:2px 0;font-size:13px}
.row input{width:100%;accent-color:var(--cyan)}
.row output{text-align:right;color:var(--cyan);font-variant-numeric:tabular-nums}
.dec{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 6px;padding:7px 10px;border-radius:8px;border:1px solid var(--line)}
.dec b{font-size:16px}.dec small{color:var(--mute);text-align:right}
.btns{display:flex;gap:8px}
button{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0b2e40;color:var(--text);font:inherit;font-weight:600;cursor:pointer}
button.go{background:var(--cyan);color:#021018;border-color:var(--cyan)}
button:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
button:disabled{opacity:.5}
.msg{font-size:12px;color:var(--mute);margin-top:6px;min-height:16px}
</style>
</head>
<body>
<div class="top">
  <div class="card stage"><b id="st">Docked</b><span id="sub">MANTA Mini is attached to the submarine</span><div class="steps" id="steps"></div></div>
  <div class="card stat"><b id="bat">100%</b><span>Battery</span></div>
  <div class="card stat"><b id="prog">0/3</b><span>Inspected</span></div>
</div>
<div class="bot card">
  <div class="row"><label for="sev">Severity</label><input id="sev" type="range" min="0" max="10" value="9"><output id="sevo">9</output></div>
  <div class="row"><label for="conf">Sensor confidence</label><input id="conf" type="range" min="0" max="100" value="95"><output id="confo">95</output></div>
  <div class="row"><label for="dly">Delay risk</label><input id="dly" type="range" min="0" max="10" value="9"><output id="dlyo">9</output></div>
  <div class="dec" id="dec"><b id="decv">Deploy</b><small id="decs"></small></div>
  <div class="btns"><button class="go" id="run">Run mission</button><button id="fol">Follow ROV</button><button id="rst">Reset</button></div>
  <div class="msg" id="msg">Drag to orbit, pinch or scroll to zoom. Scoring here is illustrative and rule-based.</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var V=THREE.Vector3,$=function(i){return document.getElementById(i)};
var config=__DEEPTWIN_CONFIG__;
var scenario=config.scenario||'normal';
var FAULTS={
 cooling_fault:[['Cooling system failure',new V(-1.6,1.35,1.8),'critical'],['Battery overheating',new V(1.1,.85,1.95),'critical']],
 battery_overheat:[['Battery overheating',new V(1.1,.85,1.95),'critical']],
 pressure_fault:[['Abnormally high pressure',new V(3.1,.9,1.65),'warning']],
 water_leak:[['Water intrusion detected',new V(-2.9,-.6,1.8),'critical']]
};
var activeFaults=FAULTS[scenario]||[];

var scene=new THREE.Scene();scene.background=new THREE.Color(0x04141f);scene.fog=new THREE.Fog(0x04141f,10,46);
var cam=new THREE.PerspectiveCamera(50,1,.1,120);
var ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio||1,2));document.body.appendChild(ren.domElement);
scene.add(new THREE.AmbientLight(0x4a7f94,.8));
var sun=new THREE.DirectionalLight(0xbfe9ff,.9);sun.position.set(6,14,8);scene.add(sun);

// Submarine
var sub=new THREE.Group();scene.add(sub);
var hullM=new THREE.MeshStandardMaterial({color:0x9db2bb,metalness:.5,roughness:.45});
var darkM=new THREE.MeshStandardMaterial({color:0x2b3d47,metalness:.4,roughness:.6});
var hull=new THREE.Mesh(new THREE.SphereGeometry(1,40,28),hullM);hull.scale.set(6,2.1,2.1);sub.add(hull);
var tower=new THREE.Mesh(new THREE.BoxGeometry(2.2,1.3,.9),hullM);tower.position.set(1,2.3,0);sub.add(tower);
var mast=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,1,8),darkM);mast.position.set(1.6,3.3,0);sub.add(mast);
function fin(x,y,z,w,h,d){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),hullM);m.position.set(x,y,z);sub.add(m)}
fin(-5.2,0,0,1,.1,3.4);fin(-5.2,0,0,1,3.4,.1);fin(2.4,.4,0,1.2,.08,3.2);
var prop=new THREE.Group();prop.position.set(-6.15,0,0);sub.add(prop);
for(var b=0;b<4;b++){var bl=new THREE.Mesh(new THREE.BoxGeometry(.06,1.5,.36),darkM);bl.rotation.x=b*Math.PI/2;bl.children;var g=new THREE.Group();g.rotation.x=b*Math.PI/2;bl.rotation.x=0;bl.position.y=.75;g.add(bl);prop.add(g)}
var dome=new THREE.Mesh(new THREE.SphereGeometry(.55,20,14),new THREE.MeshStandardMaterial({color:0x2ec4d6,emissive:0x0a5560,roughness:.3}));dome.position.set(5.9,-.5,.5);sub.add(dome);
var ring=new THREE.Mesh(new THREE.TorusGeometry(.75,.07,10,32),new THREE.MeshBasicMaterial({color:0x2ec4d6}));ring.rotation.x=Math.PI/2;ring.position.set(0,-2.02,0);sub.add(ring);
var bay=new THREE.Mesh(new THREE.CylinderGeometry(.85,.85,.12,32),darkM);bay.position.set(0,-2.06,0);sub.add(bay);

// MANTA Mini ROV
var rov=new THREE.Group();scene.add(rov);
var oM=new THREE.MeshStandardMaterial({color:0xff9f1c,metalness:.2,roughness:.4});
var body=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),oM);body.scale.set(.5,.26,.34);rov.add(body);
[[-.3,.2],[-.3,-.2],[.3,.2],[.3,-.2]].forEach(function(p){var t=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.3,12),darkM);t.position.set(p[0],.12,p[1]);rov.add(t);});
[-1,1].forEach(function(s){var t=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,.34,12),darkM);t.rotation.z=Math.PI/2;t.position.set(-.1,0,s*.38);rov.add(t)});
var cam2=new THREE.Mesh(new THREE.SphereGeometry(.12,14,10),new THREE.MeshStandardMaterial({color:0xffffff,emissive:0x88ddee}));cam2.position.set(.48,0,0);rov.add(cam2);
var lamp=new THREE.PointLight(0x8ee9ff,.0,6);lamp.position.set(.6,0,0);rov.add(lamp);
var dock=new V(0,-2.55,0);rov.position.copy(dock);

// Tether
var tg=new THREE.BufferGeometry();tg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(6),3));
var tether=new THREE.Line(tg,new THREE.LineBasicMaterial({color:0x2ec4d6}));tether.frustumCulled=false;scene.add(tether);

// Anomalies
var NAMES=activeFaults.map(function(f){return f[0]});
var P=activeFaults.map(function(f){return f[1]});
var marks=P.map(function(p){var m=new THREE.Mesh(new THREE.OctahedronGeometry(.28),new THREE.MeshStandardMaterial({color:activeFaults[P.indexOf(p)][2]==='warning'?0xffd166:0xff4747,emissive:activeFaults[P.indexOf(p)][2]==='warning'?0x8a6a10:0x991818}));m.position.copy(p);scene.add(m);return m});

// Fault labels anchored to the corresponding 3D marker positions.
var labels=marks.map(function(m,i){var el=document.createElement('div');el.textContent='⚠ '+NAMES[i];el.style.cssText='position:fixed;z-index:1;pointer-events:none;background:rgba(30,9,12,.90);color:#fff;padding:5px 9px;border:1px solid #ff6b6b;border-radius:7px;font:600 12px system-ui;white-space:nowrap';document.body.appendChild(el);return el});
var banner=document.createElement('div');banner.style.cssText='position:fixed;z-index:2;top:92px;left:10px;max-width:60%;background:rgba(5,22,33,.93);padding:8px 12px;border:1px solid #1d4a5e;border-radius:8px;color:#e6f4f8;font:600 12px system-ui';banner.textContent=activeFaults.length?'⚠ '+activeFaults.map(function(f){return f[0]}).join(' + '):'✓ SYSTEM HEALTHY — no detected faults';document.body.appendChild(banner);
// Seabed and snow
var sg=new THREE.PlaneGeometry(90,90,45,45);sg.rotateX(-Math.PI/2);
var sp=sg.attributes.position;for(var i=0;i<sp.count;i++){var x=sp.getX(i),z=sp.getZ(i);sp.setY(i,-9+Math.sin(x*.35)*.6+Math.cos(z*.3)*.7+Math.sin((x+z)*.9)*.15)}sg.computeVertexNormals();
scene.add(new THREE.Mesh(sg,new THREE.MeshStandardMaterial({color:0x143a4a,roughness:1,flatShading:true})));
var N=350,sa=new Float32Array(N*3);for(i=0;i<N*3;i++)sa[i]=(Math.random()-.5)*40;
var sgm=new THREE.BufferGeometry();sgm.setAttribute('position',new THREE.BufferAttribute(sa,3));
scene.add(new THREE.Points(sgm,new THREE.PointsMaterial({color:0xbfe9ff,size:.07,transparent:true,opacity:.6})));

// Orbit camera
var th=.9,ph=1.25,rad=17,tgt=new V(0,0,0),follow=false,ptrs={},pd=0;
var cv=ren.domElement;
cv.addEventListener('pointerdown',function(e){cv.setPointerCapture(e.pointerId);ptrs[e.pointerId]=[e.clientX,e.clientY];pd=0});
cv.addEventListener('pointerup',function(e){delete ptrs[e.pointerId];pd=0});
cv.addEventListener('pointercancel',function(e){delete ptrs[e.pointerId];pd=0});
cv.addEventListener('pointermove',function(e){var p=ptrs[e.pointerId];if(!p)return;var ids=Object.keys(ptrs);
 if(ids.length===1){th-=(e.clientX-p[0])*.006;ph=Math.max(.2,Math.min(2.9,ph-(e.clientY-p[1])*.006))}
 p[0]=e.clientX;p[1]=e.clientY;
 if(ids.length===2){var a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)rad=Math.max(4,Math.min(40,rad*pd/d));pd=d}});
cv.addEventListener('wheel',function(e){e.preventDefault();rad=Math.max(4,Math.min(40,rad*(1+e.deltaY*.001)))},{passive:false});

// Decision engine (illustrative, rule-based)
var COST=4.4;
function decide(){var s=+$('sev').value,c=+$('conf').value,d=+$('dly').value;
 var risk=.45*s+.35*d+.2*(c/10);var r;
 if(c<60)r=['Escalate','Human review is required: sensor confidence is low.','var(--warn)'];
 else if(risk>COST)r=['Deploy','Inspection is justified by the risk.','var(--ok)'];
 else r=['Monitor','No immediate deployment needed.','var(--mute)'];
 $('sevo').value=s;$('confo').value=c;$('dlyo').value=d;
 $('decv').textContent=r[0];$('decv').style.color=r[2];$('dec').style.borderColor=r[2];
 $('decs').textContent='Risk '+risk.toFixed(1)+' vs cost '+COST.toFixed(1)+'. '+r[1];return r[0]}
['sev','conf','dly'].forEach(function(i){$(i).addEventListener('input',decide)});

// Mission
var LABELS=['Detect','Assess','Detach','Inspect','Reconnect','Resume'];
var st=$('steps');LABELS.forEach(function(){st.appendChild(document.createElement('i'))});
function lowV(p){return new V(p.x,-3.3,p.z)}
var steps,k,wait,bat,done,running,speed,pulse=0;
function build(){steps=[{s:0,w:2,sub:'Anomaly flagged by the submarine sensors'},{s:1,w:2.2,assess:1,sub:'Scoring severity, confidence and delay risk'},{s:2,go:new V(0,-3.3,0),w:.2,sub:'MANTA Mini detaches from the dock'}];
 for(var i=0;i<P.length;i++){steps.push({s:3,i:i,go:lowV(P[i]),w:0,sub:'Travelling to fault location '+(i+1)});steps.push({s:3,i:i,go:P[i].clone(),w:1.6,mark:1,sub:NAMES[i]})}
 steps.push({s:4,go:new V(0,-3.3,0),w:0,sub:'Returning to the dock'});steps.push({s:4,go:dock.clone(),w:.8,sub:'Reconnecting'});
 steps.push({s:5,w:5,resume:1,sub:'The submarine resumes navigation'})}
function ui(){var cur=steps&&k<steps.length?steps[k].s:5;
 [].forEach.call(st.children,function(e,i){e.className=!running&&!done?'':(i<cur||done?'on':(i===cur?'cur':''))});
 $('bat').textContent=Math.round(bat)+'%';$('prog').textContent=marks.filter(function(m){return m.userData.ok}).length+'/'+marks.length}
function reset(){build();k=0;wait=0;bat=100;done=false;running=false;speed=0;rov.position.copy(dock);rov.rotation.set(0,0,0);lamp.intensity=0;
 marks.forEach(function(m,i){m.userData.ok=false;var warn=activeFaults[i][2]==='warning';m.material.color.set(warn?0xffd166:0xff4747);m.material.emissive.set(warn?0x8a6a10:0x991818)});
 $('st').textContent='Docked';$('sub').textContent=activeFaults.length?'Fault detected — inspection available':'System healthy — MANTA Mini docked';$('run').disabled=false;$('msg').textContent=activeFaults.length?'Fault markers indicate approximate inspection areas. Run mission to inspect.':'No fault detected. Run mission to demonstrate decision workflow.';ui()}
$('run').addEventListener('click',function(){if(running||done)return;running=true;$('run').disabled=true;$('msg').textContent='';ui()});
$('rst').addEventListener('click',reset);
$('fol').addEventListener('click',function(){follow=!follow;this.style.borderColor=follow?'var(--cyan)':'var(--line)'});

var clk=new THREE.Clock();
function loop(){requestAnimationFrame(loop);var dt=Math.min(clk.getDelta(),.05),t=clk.elapsedTime;
 if(running&&k<steps.length){var s=steps[k];$('st').textContent=LABELS[s.s]+(s.s===3?' '+(s.i+1)+' of '+P.length:'');$('sub').textContent=s.sub;
  if(s.go){var d=s.go.clone().sub(rov.position),L=d.length();
   if(L>.04){var step=Math.min(L,3.2*dt);rov.position.add(d.normalize().multiplyScalar(step));bat=Math.max(0,bat-.45*dt);
    var yaw=Math.atan2(-d.z,d.x);if(Math.hypot(d.x,d.z)>.05)rov.rotation.y+=(yaw-rov.rotation.y)*Math.min(1,dt*5);lamp.intensity=1.2}
   else{wait+=dt;if(s.mark&&!marks[s.i].userData.ok){marks[s.i].userData.ok=true;marks[s.i].material.color.set(0x5be3a0);marks[s.i].material.emissive.set(0x1a8a55)}
    if(wait>=s.w){k++;wait=0}}}
  else{wait+=dt;if(s.resume)speed=1;
   if(s.assess&&wait>1.2&&!s.checked){s.checked=1;var dd=decide();if(dd!=='Deploy'){running=false;done=true;$('st').textContent=dd;$('sub').textContent='MANTA Mini stays docked';$('msg').textContent='No deployment. Raise severity or delay risk, or lift sensor confidence, then reset and run again.';$('run').disabled=true;ui();return renderFrame(dt,t)}}
   if(wait>=s.w){k++;wait=0}}
  if(k>=steps.length){running=false;done=true;speed=1;lamp.intensity=0;$('st').textContent='Mission complete';$('sub').textContent='MANTA Mini is docked and the submarine is underway';$('msg').textContent='Press Reset to run it again.'}
  ui()}
 renderFrame(dt,t)}
function renderFrame(dt,t){
  marks.forEach(function(m,i){var q=m.position.clone().project(cam);var visible=q.z<1&&q.z>-1;labels[i].style.display=visible?'block':'none';labels[i].style.left=((q.x+1)*innerWidth/2+12)+'px';labels[i].style.top=((-q.y+1)*innerHeight/2-12)+'px';labels[i].style.borderColor=m.userData.ok?'#5be3a0':activeFaults[i][2]==='warning'?'#ffd166':'#ff6b6b';labels[i].textContent=(m.userData.ok?'✓ INSPECTED: ':'⚠ ')+NAMES[i]});
 prop.rotation.x+=dt*(speed?9:1.2);
 marks.forEach(function(m,i){m.rotation.y+=dt*1.2;var base=m.userData.ok?1:1+.18*Math.sin(t*5+i);m.scale.setScalar(base)});
 var a=tg.attributes.position.array;a[0]=0;a[1]=-2.05;a[2]=0;a[3]=rov.position.x;a[4]=rov.position.y+.15;a[5]=rov.position.z;tg.attributes.position.needsUpdate=true;
 var sn=sgm.attributes.position.array,fl=speed?4:.3;for(var i=0;i<N;i++){sn[i*3]-=fl*dt;sn[i*3+1]+=Math.sin(t+i)*.002;if(sn[i*3]<-20)sn[i*3]+=40}sgm.attributes.position.needsUpdate=true;
 sub.position.y=Math.sin(t*.8)*.04;
 var goal=follow?rov.position:new V(0,-.5,0);tgt.lerp(goal,Math.min(1,dt*3));
 cam.position.set(tgt.x+rad*Math.sin(ph)*Math.cos(th),tgt.y+rad*Math.cos(ph),tgt.z+rad*Math.sin(ph)*Math.sin(th));cam.lookAt(tgt);
 ren.render(scene,cam)}
function size(){var w=innerWidth,h=innerHeight;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();rad=Math.max(rad,w<600?20:rad)}
addEventListener('resize',size);size();
var defaults={normal:[1,95,1],cooling_fault:[9,95,9],battery_overheat:[8,95,8],pressure_fault:[6,90,6],water_leak:[9,95,9]};
var d=defaults[scenario]||defaults.normal;$('sev').value=d[0];$('conf').value=d[1];$('dly').value=d[2];
decide();reset();loop();
})();
</script>
</body>
</html>
